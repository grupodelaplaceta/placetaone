openapi: 3.0.3
info: {title: Placeta One API v1, version: "1.1", description: "Importes en Pz. Autenticación por x-api-key (por entidad)."}
paths:
  /api/v1/transfers:
    post:
      summary: Transferencia entre cuentas (origen de la propia entidad)
      parameters: [{name: Idempotency-Key, in: header, required: true, schema: {type: string}}]
      requestBody: {content: {application/json: {schema: {type: object, required: [from_iban,to_iban,amount], properties: {from_iban: {type: string, example: PZ-0027-0148}, to_iban: {type: string}, amount: {type: number, multipleOf: 0.01}, memo: {type: string}}}}}}
      responses: {"200": {description: "{transfer, operation}"}, "403": {description: Scope o entidad}, "422": {description: Regla de negocio}, "429": {description: Límite de uso}}
  /api/v1/accounts/{iban}:
    get:
      summary: Consulta de cuenta (saldo solo de la propia entidad)
      parameters: [{name: iban, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: OK}, "404": {description: No encontrada}}
